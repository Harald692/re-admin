name: EXE bauen
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Programm bauen
        run: dotnet build ReAdmin\ReAdmin.csproj -c Release -o out
      - name: Installer bauen
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVer=1.0.${{ github.run_number }}" installer.iss
      - name: Pakete zusammenstellen
        shell: pwsh
        run: |
          Remove-Item out\*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path out\* -DestinationPath re-admin-portable.zip
          Copy-Item Output\re-admin-Setup.exe re-admin-Setup.exe
          Compress-Archive -Path re-admin-Setup.exe -DestinationPath re-admin-Setup.zip
      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: re admin ${{ github.run_number }}
          files: |
            re-admin-Setup.zip
            re-admin-Setup.exe
            re-admin-portable.zip
          make_latest: true
      - uses: actions/upload-artifact@v4
        with:
          name: re-admin-Windows
          path: |
            re-admin-Setup.zip
            re-admin-portable.zip
      - name: Download-Kopie im Zweig "downloads" ablegen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dl | Out-Null
          Copy-Item re-admin-Setup.zip,re-admin-portable.zip dl\
          cd dl
          git init -q
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -q -b downloads
          git add -A
          git commit -q -m "re admin ${{ github.run_number }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" downloads
