<style>
:root{
  --bg:#f4f5f2; --panel:#ffffff; --ink:#1d2321; --muted:#68716d; --line:#dfe3df;
  --accent:#1f5c4f; --accent-ink:#ffffff; --accent-soft:#e3efeb;
  --warn:#b26a00; --warn-soft:#fff3dc; --bad:#b3261e; --bad-soft:#fde8e6; --ok:#2e7d4f; --ok-soft:#e5f4ea; --exp:#c0703a;
  --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151918; --panel:#1e2422; --ink:#e7ece9; --muted:#9aa5a0; --line:#2f3734;
    --accent:#5fb39d; --accent-ink:#0e1513; --accent-soft:#22332e;
    --warn:#e7a948; --warn-soft:#3a2f1c; --bad:#f08a80; --bad-soft:#3d2422; --ok:#7fcf9c; --ok-soft:#1f3328; --exp:#e09a63; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#151918; --panel:#1e2422; --ink:#e7ece9; --muted:#9aa5a0; --line:#2f3734;
  --accent:#5fb39d; --accent-ink:#0e1513; --accent-soft:#22332e;
  --warn:#e7a948; --warn-soft:#3a2f1c; --bad:#f08a80; --bad-soft:#3d2422; --ok:#7fcf9c; --ok-soft:#1f3328; --exp:#e09a63; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px 16px;padding:8px 20px 0;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:10px}
.brand .appicon{width:34px;height:34px;border-radius:8px;display:block}
.brand .bname{font-size:16px;letter-spacing:.1px}.brand .bname small{display:block;font-size:11px;font-weight:500;color:var(--muted);letter-spacing:.3px}
nav{display:flex;gap:2px;flex-wrap:nowrap;order:3;flex:1 0 100%;overflow-x:auto;scrollbar-width:thin;margin:0 -8px;padding:0 0 6px}
nav button{border:0;background:none;padding:7px 9px;border-radius:7px;cursor:pointer;color:var(--muted);white-space:nowrap;flex:0 0 auto;font-size:13.5px}
nav button:hover{background:var(--bg);color:var(--ink)}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav .caret{font-size:10px;opacity:.7}
.subnav{order:4;flex:1 0 100%;display:flex;gap:4px;overflow-x:auto;margin:0 -20px;padding:6px 20px;background:var(--bg);border-top:1px solid var(--line)}
.subnav button{border:1px solid transparent;background:none;padding:5px 12px;border-radius:99px;cursor:pointer;color:var(--muted);white-space:nowrap;flex:0 0 auto;font-size:13px}
.subnav button:hover{color:var(--ink);border-color:var(--line);background:var(--panel)}
.subnav button.on{background:var(--panel);border-color:var(--accent);color:var(--accent);font-weight:600}
.spacer{flex:1}
.yearsel{display:flex;align-items:center;gap:6px;color:var(--muted)}
main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.two{grid-template-columns:1fr 1fr}
@media (max-width:860px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--bg)}
tfoot td{font-weight:700;border-bottom:0}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}

function calcInvoice(inv,settings){
  const netto=r2((inv.positionen||[]).reduce((s,p)=>s+r2((+p.menge||0)*(+p.preis||0)),0));
  const mwstProzent=inv.steuerArt==='mwst'?(+inv.mwstSatz||0):0;
  const mwst=r2(netto*mwstProzent/100);
  let total=r2(netto+mwst),rund=0;
  if(inv.waehrung==='CHF'&&settings&&settings.rund05){const t=Math.round(total*20)/20;rund=r2(t-total);total=r2(t)}

}

  const tail=a=>[a.bic?'BIC '+a.bic:'',a.inh?'lautend auf '+a.inh:''].filter(Boolean).join('  ·  ');
  if(sameBank){
    if(acc[0].bank)out.push('Bankverbindung: '+acc[0].bank);
    acc.forEach(a=>out.push([a.iban+' '+a.lbl,tail(a)].filter(Boolean).join('   ')));
  }else{
    acc.forEach(a=>out.push([a.lbl+': '+(a.bank||''),a.iban,tail(a)].filter(Boolean).join('   ')));
  }
  return out;
}
function fmtPct(v){return (+v||0).toFixed(2)+'%'}
const DOC_TYP={
  rechnung:{titel:'Rechnung',nrLabel:'Rechnung Nummer',preise:true,summe:'Rechnungsbetrag',ordner:'Ausgangsrechnungen'},
  angebot:{titel:'Angebot',nrLabel:'Angebot Nummer',preise:true,summe:'Angebotssumme',ordner:'Angebote',plural:'Angebote',neu:'Neues Angebot'},
  ab:{titel:'Auftragsbestätigung',nrLabel:'Auftragsbestätigung Nummer',preise:true,summe:'Auftragssumme',ordner:'Auftragsbestaetigungen',plural:'Auftragsbestätigungen',neu:'Neue Auftragsbestätigung'},
  ls:{titel:'Lieferschein',nrLabel:'Lieferschein Nummer',preise:false,ordner:'Lieferscheine',plural:'Lieferscheine',neu:'Neuer Lieferschein'}};
function docRefs(d){const r=[];
  if(d.bestellNr)r.push(['Ihre Bestellung:',d.bestellNr+(d.bestellDatum?' vom '+fmtDate(d.bestellDatum):'')]);
  if(d.angebotNr)r.push(['Unser Angebot:',d.angebotNr+(d.angebotDatum?' vom '+fmtDate(d.angebotDatum):'')]);
  if(d.abNr)r.push(['Auftragsbestätigung:',d.abNr+(d.abDatum?' vom '+fmtDate(d.abDatum):'')]);
  if(d.lsNr)r.push(['Lieferschein:',d.lsNr]);
  return r;}
function buildInvoicePDF(inv,S,logo){return buildDocPDF(inv,S,logo,'rechnung')}
function buildDocPDF(inv,S,logo,typ){
  typ=typ||'rechnung';const T=DOC_TYP[typ],preise=T.preise;
  const pdf=new MiniPDF();
  const L=71,R=547,ink=[0,0,0],gray=[.3,.3,.3],band=[206/255,241/255,63/255];
  const k=inv.kunde||{};const c=preise?calcInvoice(inv,S):null;const cur=inv.waehrung||S.waehrung;const curSym=cur==='EUR'?'€':cur;
  if(logo)pdf.setImage(logo.bin,logo.w,logo.h);
  // Spalten: Pos | Beschreibung | Menge | Einheit | a Preis | Summe   (Lieferschein: ohne Preise)
  const X=preise?[80,137,354,392,417,483,547]:[80,137,437,492,547];
  const XR=X[X.length-1];
  const vlines=(y1,y2)=>{for(let i=0;i<X.length;i++)pdf.line(X[i],y1,X[i],y2,.75,ink)};
  let page=0;
  const footer=()=>{
    if(S.slogan)pdf.text(R,773,S.slogan,{size:8,color:gray,align:'right'});
    const f=bankLines(S,cur);
    const last=[S.uid?'UID: '+S.uid:'',S.shab?'SHAB Nr. '+S.shab:''].filter(Boolean).join('      ');
    if(last)f.push(last);
    let fy=783;for(const t of f){pdf.text(69.5,fy,t,{size:8,color:gray});fy+=9.7}
    if(page>1)pdf.text(R,812,'Seite '+page,{size:8,color:gray,align:'right'});
  };
  const newPage=()=>{pdf.addPage();page++;footer()};
  const tableHead=y=>{
    const h=31;pdf.line(X[0],y,XR,y,.75,ink);pdf.line(X[0],y+h,XR,y+h,.75,ink);
    const o={size:12},oc={size:12,align:'center'};
    if(preise){
      for(const i of [0,1,2,4,5,6])pdf.line(X[i],y,X[i],y+h,.75,ink);
      pdf.text((X[0]+X[1])/2,y+12,'Pos',oc);
      pdf.text(X[1]+2,y+12,'Artikel / Beschreibung',o);
      pdf.text((X[2]+X[4])/2,y+12,'Menge',oc);
      pdf.text((X[4]+X[5])/2,y+12,'a Preis',oc);pdf.text((X[4]+X[5])/2,y+26,curSym,oc);
      pdf.text((X[5]+X[6])/2,y+12,'Summe',oc);pdf.text((X[5]+X[6])/2,y+26,curSym,oc);
    }else{
      for(let i=0;i<X.length;i++)pdf.line(X[i],y,X[i],y+h,.75,ink);
      pdf.text((X[0]+X[1])/2,y+12,'Pos',oc);
      pdf.text(X[1]+2,y+12,'Artikel / Beschreibung',o);
      pdf.text((X[2]+X[3])/2,y+12,'Menge',oc);
      pdf.text((X[3]+X[4])/2,y+12,'Einheit',oc);
    }
    return y+h;
  };
  newPage();
  // Logo
  if(logo){let w=135,h=w*logo.h/logo.w;if(h>45){h=45;w=h*logo.w/logo.h}pdf.image(R+23-w,49,w,h)}
  // Grünes Band
  pdf.rect(6,110,589,153,band);
  pdf.text(69,135,[S.firma,S.strasse,S.plzOrt].filter(Boolean).join(' – '),{size:5.5,color:gray});
  const adr=[k.name,k.zusatz,k.kontakt?('z. H. '+k.kontakt):'',k.strasse,k.plzOrt].filter(Boolean);
  adr.forEach((t,i)=>pdf.text(70.9,151+i*12.1,t,{size:10,color:gray}));
  let ry=137;for(const t of [S.firma,S.strasse,S.plzOrt]){if(t)pdf.text(421.6,ry,t,{size:8,color:gray});ry+=12.5}
  ry+=12.5;
  for(const [a,b] of [['Mobil',S.telefon],['E-mail',S.email],['Web',S.web]]){if(!b)continue;pdf.text(421.6,ry,a,{size:8,color:gray});pdf.text(457.7,ry,b,{size:8,color:gray});ry+=12.5}
  // Kopf unter dem Band
  if(k.uid)pdf.text(70.9,284,'Ihre UID: '+k.uid,{size:10});
  pdf.text(536,308,[S.ort?S.ort+',':'',fmtDate(inv.datum),S.kuerzel].filter(Boolean).join(' '),{size:10,align:'right'});
  let y=344;
  pdf.text(70.9,y,T.nrLabel+': '+(inv.nr||'ENTWURF'),{size:10});
  const refs=docRefs(inv);
  for(const [a,b] of refs){y+=12.1;pdf.text(70.9,y,a,{size:10});pdf.text(185,y,b,{size:10})}
  if(inv.betreff){y+=12;pdf.text(70.9,y,inv.betreff,{size:10,bold:true})}
  const intro={angebot:S.angebotIntro,ab:S.abIntro,ls:S.lsIntro}[typ];
  if(intro){y+=6;for(const t of wrapText(intro,R-L,10)){y+=12.1;pdf.text(70.9,y,t,{size:10})}}
  y=tableHead(y+(inv.betreff||intro||refs.length?10:14));
  // Positionen
  const pos=inv.positionen||[];
  const tw=X[2]-X[1]-6;
  pos.forEach((p,i)=>{
    const parts=String(p.text||'').split(/\r?\n/);
    const head=wrapText(parts[0],tw,9,true);
    const rest=wrapText(parts.slice(1).join('\n'),tw,9,false).filter((t,j,a)=>!(t===''&&j===a.length-1));
    const lines=[...head.map(t=>[t,true]),...(parts.length>1?rest.map(t=>[t,false]):[])];
    const h=Math.max(36,lines.length*11.5+14);
    if(y+h>700){newPage();y=tableHead(70)}
    const y0=y;vlines(y0,y0+h);pdf.line(X[0],y0+h,XR,y0+h,.75,ink);
    let ty=y0+(h-lines.length*11.5)/2+8.5;
    lines.forEach(([t,b],j)=>pdf.text(X[1]+2,ty+j*11.5,t,{size:9,bold:b}));
    const mid=y0+h/2+3.5;
    pdf.text((X[0]+X[1])/2,mid,String((i+1)*10),{size:9,align:'center'});
    pdf.text((X[2]+X[3])/2,mid,fmtMenge(p.menge),{size:9,align:'center'});
    pdf.text((X[3]+X[4])/2,mid,p.einheit||'',{size:9,align:'center'});
    if(preise){
      pdf.text((X[4]+X[5])/2,mid,fmtNum(p.preis),{size:9,align:'center'});
      pdf.text(X[6]-12,mid,fmtNum(r2((+p.menge||0)*(+p.preis||0))),{size:9,align:'right'});
    }
    y=y0+h;
  });
  // Summenzeilen
  if(preise){
    if(y+60>700){newPage();y=70;pdf.line(X[1],y,X[6],y,.75,ink)}
    const sumRow=(label,pct,val,bold,last)=>{
      const h=14.5;for(let i=1;i<X.length;i++)pdf.line(X[i],y,X[i],y+h,.75,ink);
      pdf.line(X[1],y+h,X[6],y+h,last?1.5:.75,ink);
      pdf.text(X[1]+2,y+10.5,label,{size:9,bold});
      if(pct)pdf.text(X[5]-3,y+10.5,pct,{size:9,align:'right'});
      pdf.text(X[6]-2,y+10.5,val,{size:9,bold,align:'right'});
      y+=h;
    };
    sumRow('Nettosumme','',fmtNum(c.netto));
    sumRow('MWST',fmtPct(c.mwstProzent),fmtNum(c.mwst));
    if(c.rund)sumRow('Rundung','',fmtNum(c.rund));
    sumRow(T.summe,'',fmtNum(c.total),true,true);
  }
  // Text unter der Tabelle
  y+=34;
  const notes=[];
  if(typ==='ls'){
    if(inv.lieferdatum)notes.push(['Lieferdatum:',fmtDate(inv.lieferdatum)]);
    if(inv.bemerkung)notes.push(['',inv.bemerkung]);
  }else{
    const zt=(inv.zahlText||S.zahlText||'').replace(/\{faellig\}/g,typ==='rechnung'?fmtDate(inv.faellig):'').replace(/\{ziel\}/g,inv.ziel||'').replace(/\{nr\}/g,inv.nr||'').replace(/\{waehrung\}/g,cur).replace(/\s+,/g,',').trim();
    if(inv.steuerArt==='mwst'&&S.mwstText)notes.push(['',S.mwstText]);
    if(typ==='angebot')notes.push(['Gültigkeit:',inv.freibleibend?'Dieses Angebot ist freibleibend.':'Dieses Angebot ist gültig bis '+fmtDate(inv.gueltigBis)+'.']);
    if(inv.liefertermin)notes.push(['Liefertermin:',fmtDate(inv.liefertermin)]);
    if(inv.zeitraum)notes.push(['Leistungszeitraum:',inv.zeitraum]);
    if(zt)notes.push(['Zahlungsbedingungen:',zt]);
    if(inv.steuerArt==='rc'&&S.rcText)notes.push(['',S.rcText]);
    if(inv.steuerArt==='frei'&&S.freiText)notes.push(['',S.freiText]);
    if(inv.bemerkung)notes.push(['',inv.bemerkung]);
  }
  const lineCount=notes.reduce((n,[a,b])=>n+wrapText(b,a?R-215:R-L,10).length,0);
  if(y+lineCount*12.1+(typ==='ls'?150:76)>758){newPage();y=80}
  for(const [a,b] of notes){
    const ls=wrapText(b,a?R-215:R-L,10);
    if(a)pdf.text(70.9,y,a,{size:10});
    ls.forEach((t,j)=>pdf.text(a?215:70.9,y+j*12.1,t,{size:10}));
    y+=ls.length*12.1;
  }
  if(typ==='ls'){
    y+=26;
    for(const t of wrapText(S.lsQuittung||'Ware / Leistung erhalten:',R-L,10)){pdf.text(70.9,y,t,{size:10});y+=12.1}
    y+=40;
    pdf.line(70.9,y,262,y,.6,ink);pdf.line(300,y,R,y,.6,ink);
    pdf.text(70.9,y+12,'Ort, Datum',{size:8.5,color:gray});pdf.text(300,y+12,'Name und Unterschrift Empfänger',{size:8.5,color:gray});
    y+=40;
    if(S.gruss){pdf.text(70.9,y,S.gruss,{size:10});y+=26}
    if(S.inhaber)pdf.text(70.9,y,S.inhaber,{size:10});
    return pdf.output();
  }
  y+=22;
  const dank=typ==='angebot'?S.angebotDank:S.dankText;
  if(dank){pdf.text(70.9,y,dank,{size:10});y+=22}
  if(S.gruss){pdf.text(70.9,y,S.gruss,{size:10});y+=32}
  if(S.inhaber)pdf.text(70.9,y,S.inhaber,{size:10});
  return pdf.output();
}

<script>
/* ===================== Speicher: OneDrive-Ordner (File System Access) oder Vorschau ===================== */
let dir=null,DEMO=false,D=null,demoFiles=new Map(),lastBackup='';
const idb={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('rechnungen-app',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async get(k){const db=await this.open();return new Promise(res=>{const t=db.transaction('kv').objectStore('kv').get(k);t.onsuccess=()=>res(t.result);t.onerror=()=>res(null)})},
  async set(k,v){const db=await this.open();return new Promise(res=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res()})}
};
/* Windows-Programm (re admin.exe): Dateizugriff über das Programm statt über Edge */
const NATIVE=!!(window.chrome&&window.chrome.webview&&window.chrome.webview.postMessage);
const nat={seq:0,wait:new Map(),call(cmd,args){return new Promise((res,rej)=>{const id=++this.seq;this.wait.set(id,{res,rej});window.chrome.webview.postMessage(Object.assign({id,cmd},args||{}))})}};
if(NATIVE)window.chrome.webview.addEventListener('message',e=>{const m=e.data||{};const w=nat.wait.get(m.id);if(!w)return;nat.wait.delete(m.id);m.ok?w.res(m.result):w.rej(new Error(m.error||'Fehler im Programm'))});
async function zuB64(data){const blob=data instanceof Blob?data:new Blob([data]);return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]||'');r.onerror=()=>rej(r.error);r.readAsDataURL(blob)})}
async function ausB64(b64){return await (await fetch('data:application/octet-stream;base64,'+b64)).arrayBuffer()}
async function getDir(path,create){let d=dir;for(const p of path){d=await d.getDirectoryHandle(p,{create})}return d}
async function writeFile(path,data){
  if(DEMO){demoFiles.set(path.join('/'),data instanceof Blob?data:new Blob([data]));return}
  if(NATIVE){await nat.call('write',{path,b64:await zuB64(data)});return}
  const d=await getDir(path.slice(0,-1),true);const fh=await d.getFileHandle(path.at(-1),{create:true});
  const w=await fh.createWritable();await w.write(data);await w.close();
}
async function readFile(path){
  if(DEMO){const b=demoFiles.get(path.join('/'));return b?new File([b],path.at(-1)):null}
  if(NATIVE){try{const r=await nat.call('read',{path});return r?new File([await ausB64(r.b64)],path.at(-1),{lastModified:r.mtime}):null}catch(e){return null}}
  try{const d=await getDir(path.slice(0,-1),false);const fh=await d.getFileHandle(path.at(-1));return await fh.getFile()}catch(e){return null}
}
async function removeFile(path){
  if(DEMO){demoFiles.delete(path.join('/'));return}
  if(NATIVE){try{await nat.call('remove',{path})}catch(e){}return}
  try{const d=await getDir(path.slice(0,-1),false);await d.removeEntry(path.at(-1))}catch(e){}
}
async function listFiles(path){
  if(DEMO){const pre=path.join('/')+'/';return [...demoFiles.keys()].filter(k=>k.startsWith(pre)&&!k.slice(pre.length).includes('/')).map(k=>k.slice(pre.length))}
  if(NATIVE){try{return await nat.call('list',{path})||[]}catch(e){return []}}
  try{const d=await getDir(path,true);const out=[];for await(const [n,h] of d.entries())if(h.kind==='file')out.push(n);return out}catch(e){return []}
}
async function moveFile(from,to){const f=await readFile(from);if(!f)throw new Error('Datei nicht gefunden: '+from.join('/'));await writeFile(to,f);await removeFile(from)}
async function openFile(path){
  const f=await readFile(path);if(!f){toast('Datei nicht gefunden: '+path.join('/'));return}
  await showPdf(await f.arrayBuffer(),path.at(-1));

const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),3200)}
function slug(s){return String(s||'').normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'x'}
function sumByCur(list,fn){const m={};for(const x of list){const c=x.waehrung||'CHF';m[c]=r2((m[c]||0)+fn(x))}return m}
function fmtMulti(m){const ks=Object.keys(m);if(!ks.length)return fmtMoney(0,D.settings.waehrung);return ks.map(k=>fmtMoney(m[k],k)).join(' · ')}
function kpiMulti(m){const nz=Object.fromEntries(Object.entries(m).filter(([k,v])=>v));return fmtMulti(Object.keys(nz).length?nz:m).split(' · ').join('<br>')}
function ask(text,okLabel='OK',danger=false){return new Promise(res=>{const m=modal(`<p style="margin:0 0 18px;font-size:15px">${h(text)}</p><div class="row end"><button class="btn" id="a-no">Abbrechen</button><button class="btn ${danger?'danger':'pri'}" id="a-ok">${h(okLabel)}</button></div>`);
  m.querySelector('#a-no').onclick=()=>{m.remove();res(false)};m.querySelector('#a-ok').onclick=()=>{m.remove();res(true)};m.querySelector('#a-ok').focus()})}
function askDate(text,def){return new Promise(res=>{const m=modal(`<label class="f" style="margin-bottom:16px">${h(text)}<input type="date" id="a-d" value="${def}"></label><div class="row end"><button class="btn" id="a-no">Abbrechen</button><button class="btn pri" id="a-ok">Übernehmen</button></div>`);
  m.querySelector('#a-no').onclick=()=>{m.remove();res(null)};m.querySelector('#a-ok').onclick=()=>{const v=m.querySelector('#a-d').value;m.remove();res(v||null)}})}
const EMBEDDED=(()=>{try{return window.self!==window.top}catch(e){return true}})();
let pdfjsReady=null;
function loadPdfjs(){if(pdfjsReady)return pdfjsReady;const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/';
  const add=src=>new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=src;sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)});
  pdfjsReady=add(base+'pdf.min.js').then(()=>add(base+'pdf.worker.min.js')).then(()=>{pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';return pdfjsLib});return pdfjsReady}
async function showPdf(bytes,name){
  if(NATIVE){try{await nat.call('openPdf',{name:name||'Dokument.pdf',b64:await zuB64(new Blob([bytes]))})}catch(e){toast('PDF konnte nicht geöffnet werden: '+e.message)}return}
  const blob=new Blob([bytes],{type:'application/pdf'});
  if(!EMBEDDED){const url=URL.createObjectURL(blob);const w=window.open(url,'_blank');if(!w){const a=document.createElement('a');a.href=url;a.download=name||'rechnung.pdf';a.click()}return}
  const m=modal(`<div class="row" style="justify-content:space-between;margin-bottom:10px"><b>${h(name||'PDF')}</b><button class="btn sm" id="p-x">Schliessen</button></div><div id="p-pages" style="display:grid;gap:12px"><div class="empty">PDF wird geladen …</div></div>`);
  m.querySelector('.modal').style.maxWidth='860px';m.querySelector('#p-x').onclick=()=>m.remove();
  try{const lib=await loadPdfjs();const doc=await lib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise;const box=m.querySelector('#p-pages');box.innerHTML='';
    for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const vp=pg.getViewport({scale:1.6});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;c.style.cssText='width:100%;height:auto;border:1px solid var(--line);border-radius:4px;background:#fff';box.appendChild(c);await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise}}
  catch(e){m.querySelector('#p-pages').innerHTML='<div class="empty">Die PDF-Anzeige ist in dieser Vorschau nicht verfügbar. In der App auf deinem PC öffnet sich das PDF direkt.</div>'}
}
function modal(html){const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML=`<div class="modal">${html}</div>`;bg.addEventListener('mousedown',e=>{if(e.target===bg)bg.remove()});document.body.appendChild(bg);return bg}
function invStatus(r){
  if(r.status!=='offen')return r.status;
  const t=todayISO();if(r.faellig<t)return 'ueber';if(r.faellig<=addDays(t,7))return 'faellig';return 'offen';
}
const STATUS_TXT={entwurf:'Entwurf',offen:'Offen',faellig:'Bald fällig',ueber:'Überfällig',bezahlt:'Bezahlt',storniert:'Storniert',angenommen:'Angenommen',abgelehnt:'Abgelehnt',abgelaufen:'Abgelaufen',geliefert:'Geliefert',verrechnet:'Verrechnet',erstellt:'Erstellt'};
const badge=s=>`<span class="badge b-${s}">${STATUS_TXT[s]||s}</span>`;
function kundeById(id){return D.kunden.find(k=>k.id===id)}
async function logoForPdf(){
  const src=D.settings.logo;if(!src)return null;
  const m=src.match(/^data:image\/jpeg;base64,(.*)$/);if(!m)return null;
  const bin=atob(m[1]);
  return await new Promise(res=>{const i=new Image();i.onload=()=>res({bin,w:i.naturalWidth,h:i.naturalHeight});i.onerror=()=>res(null);i.src=src});
}

let view='uebersicht',year=new Date().getFullYear(),editing=null;
const NAV=[{k:'uebersicht',t:'Übersicht'},
  {k:'sales',t:'Sales Management',subs:[['angebote','Angebote'],['auftraege','Auftragsbestätigungen'],['lieferscheine','Lieferscheine']]},
  {k:'finanz',t:'Finanz Management',subs:[['rechnungen','Rechnungen'],['eingang','Eingangsrechnungen'],['belege','Kassabelege'],['finanzen','Finanzen & Rücklage']]},
  {k:'kunden',t:'Kunden'},{k:'lieferanten',t:'Lieferanten'},{k:'einstellungen',t:'Einstellungen'},{k:'hilfe',t:'Einrichtung'}];
const lastSub={sales:'angebote',finanz:'rechnungen'};
function curSub(){if(view==='editor')return 'rechnungen';if(view==='dokeditor'&&editDok)return VIEW_OF[editDok.typ];return view}
function groupOf(v){for(const g of NAV){if(g.k===v)return g;if(g.subs&&g.subs.some(([k])=>k===v))return g}return NAV[0]}
function years(){const s=new Set([new Date().getFullYear(),year]);D.rechnungen.forEach(r=>r.datum&&s.add(+r.datum.slice(0,4)));D.eingang.forEach(e=>e.datum&&s.add(+e.datum.slice(0,4)));(D.dokumente||[]).forEach(e=>e.datum&&s.add(+e.datum.slice(0,4)));return [...s].sort((a,b)=>b-a)}
function render(){
  const app=$('#app');const sub=curSub(),grp=groupOf(sub);if(grp.subs)lastSub[grp.k]=sub;

/* ---------- Übersicht ---------- */
function vUebersicht(){
  const inYear=D.rechnungen.filter(r=>r.nr&&r.status!=='storniert'&&r.datum?.startsWith(year));
  const offen=D.rechnungen.filter(r=>r.status==='offen');
  const ueber=offen.filter(r=>r.faellig<todayISO());
  const eingOffen=D.eingang.filter(e=>e.status==='offen');
  const ausgYear=D.eingang.filter(e=>e.datum?.startsWith(year));
  // je Kunde
  const per={};
  for(const r of inYear){const key=r.kundeId+'|'+r.waehrung;const p=per[key]||(per[key]={name:r.kunde?.name||'?',waehrung:r.waehrung,anz:0,netto:0,mwst:0,total:0,offen:0});
    p.anz++;p.netto=r2(p.netto+r.netto);p.mwst=r2(p.mwst+r.mwst);p.total=r2(p.total+r.total);if(r.status==='offen')p.offen=r2(p.offen+r.total)}
  const rows=Object.values(per).sort((a,b)=>b.netto-a.netto);
  // Monate
  const curs=[...new Set(inYear.map(r=>r.waehrung))];if(!curs.length)curs.push(D.settings.waehrung);
  const monthBlocks=curs.map(cur=>{const m=Array(12).fill(0);inYear.filter(r=>r.waehrung===cur).forEach(r=>{m[+r.datum.slice(5,7)-1]+=r.netto});const max=Math.max(...m,1);
    return `<div style="margin-top:10px"><div class="muted" style="font-size:12px">Umsatz netto pro Monat (${cur})</div>
    <div class="bars">${m.map((v,i)=>`<div class="bar" style="height:${Math.max(1.5,v/max*100)}%" data-t="${fmtMoney(v,cur)}"></div>`).join('')}</div>
    <div class="barlbl">${['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'].map(x=>`<div>${x}</div>`).join('')}</div></div>`}).join('');
  const due=[...offen].sort((a,b)=>a.faellig.localeCompare(b.faellig));
  const eDue=[...eingOffen].sort((a,b)=>(a.faellig||'').localeCompare(b.faellig||''));
  $('#main').innerHTML=`
  <h1>Übersicht ${year}</h1><p class="sub">Umsatz aus gestellten Rechnungen (ohne Entwürfe und Stornos), nach Rechnungsdatum.</p>
  <div class="grid kpis">
    <div class="card kpi"><div class="l">Umsatz netto ${year}</div><div class="v">${kpiMulti(sumByCur(inYear,r=>r.netto))}</div><div class="s">${inYear.length} Rechnungen</div></div>
    <div class="card kpi"><div class="l">MWST ${year}</div><div class="v">${kpiMulti(sumByCur(inYear,r=>r.mwst))}</div><div class="s">abzuführen (nur CH-Rechnungen)</div></div>
    <div class="card kpi"><div class="l">Offene Forderungen</div><div class="v">${kpiMulti(sumByCur(offen,r=>r.total))}</div><div class="s">${offen.length} offen${ueber.length?` · <b style="color:var(--bad)">${ueber.length} überfällig</b>`:''}</div></div>
    <div class="card kpi"><div class="l">Eingangsrechnungen offen</div><div class="v">${kpiMulti(sumByCur(eingOffen,e=>+e.betrag||0))}</div><div class="s">${eingOffen.length} zu bezahlen · ${year} gesamt ${fmtMulti(sumByCur(ausgYear,e=>+e.betrag||0))}</div></div>
  </div>
  <div class="card"><h2>Umsatz je Kunde ${year}</h2><div class="scroll">
    <table><thead><tr><th>Kunde</th><th class="n">Rechnungen</th><th class="n">Netto</th><th class="n">MWST</th><th class="n">Brutto</th><th class="n">davon offen</th></tr></thead>
    <tbody>${rows.length?rows.map(p=>`<tr><td>${h(p.name)}</td><td class="n">${p.anz}</td><td class="n">${fmtMoney(p.netto,p.waehrung)}</td><td class="n">${fmtMoney(p.mwst,p.waehrung)}</td><td class="n">${fmtMoney(p.total,p.waehrung)}</td><td class="n">${p.offen?fmtMoney(p.offen,p.waehrung):'–'}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">Noch keine Rechnungen in ${year}.</td></tr>`}</tbody>
    ${rows.length?`<tfoot><tr><td>Total</td><td class="n">${inYear.length}</td><td class="n">${fmtMulti(sumByCur(inYear,r=>r.netto))}</td><td class="n">${fmtMulti(sumByCur(inYear,r=>r.mwst))}</td><td class="n">${fmtMulti(sumByCur(inYear,r=>r.total))}</td><td class="n">${fmtMulti(sumByCur(inYear.filter(r=>r.status==='offen'),r=>r.total))}</td></tr></tfoot>`:''}
    </table></div>${monthBlocks}
    <div class="row end" style="margin-top:14px"><button class="btn" id="csv">Jahresliste als CSV in OneDrive speichern</button></div>
  </div>
  <div class="grid two">
    <div class="card"><h2>Fällige Kundenrechnungen</h2>
      <table><tbody>${due.length?due.map(r=>`<tr class="click" data-inv="${r.id}"><td><b>${h(r.nr)}</b><div class="muted">${h(r.kunde?.name)}</div></td><td>${fmtDate(r.faellig)}<div>${badge(invStatus(r))}</div></td><td class="n">${fmtMoney(r.total,r.waehrung)}</td></tr>`).join(''):'<tr><td class="empty">Keine offenen Rechnungen.</td></tr>'}</tbody></table></div>
    <div class="card"><h2>Zu bezahlende Lieferantenrechnungen</h2>
      <table><tbody>${eDue.length?eDue.map(e=>{const s=!e.faellig?'offen':e.faellig<todayISO()?'ueber':e.faellig<=addDays(todayISO(),7)?'faellig':'offen';return `<tr><td><b>${h(e.lieferant)}</b><div class="muted">${h(e.nr||'')}</div></td><td>${fmtDate(e.faellig)||'–'}<div>${badge(s)}</div></td><td class="n">${fmtMoney(e.betrag,e.waehrung)}</td></tr>`}).join(''):'<tr><td class="empty">Nichts offen.</td></tr>'}</tbody></table></div>
  </div>`;
  document.querySelectorAll('[data-inv]').forEach(t=>t.onclick=()=>{editing=JSON.parse(JSON.stringify(D.rechnungen.find(r=>r.id===t.dataset.inv)));view='editor';render()});
  $('#csv').onclick=exportCSV;
}
async function exportCSV(){
  const list=D.rechnungen.filter(r=>r.nr&&r.datum?.startsWith(year)).sort((a,b)=>(a.seq||0)-(b.seq||0));
  const head=['Nr','Datum','Fällig','Kunde','Land','UID Kunde','Steuer','Währung','Netto','MWST-Satz','MWST','Total','Status','Bezahlt am'];
  const n=v=>String(r2(v)).replace('.',',');
  const rows=list.map(r=>[r.nr,fmtDate(r.datum),fmtDate(r.faellig),r.kunde?.name,r.kunde?.land,r.kunde?.uid,r.steuerArt==='rc'?'Reverse Charge':r.steuerArt==='frei'?'befreit':'MWST',r.waehrung,n(r.netto),r.steuerArt==='mwst'?n(r.mwstSatz):'0',n(r.mwst),n(r.total),STATUS_TXT[r.status],fmtDate(r.bezahltAm)]);
  const csv='﻿'+[head,...rows].map(a=>a.map(x=>{x=String(x??'');return /[;"\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x}).join(';')).join('\r\n');
  await writeFile(['Auswertungen','Rechnungen_'+year+'.csv'],csv);
  toast('Gespeichert: Auswertungen/Rechnungen_'+year+'.csv');
}

/* ---------- Rechnungen ---------- */
let fKunde='',fStatus='';
function vRechnungen(){
  let list=D.rechnungen.filter(r=>(r.datum||'').startsWith(year)||r.status==='entwurf');
  if(fKunde)list=list.filter(r=>r.kundeId===fKunde);
  if(fStatus)list=list.filter(r=>fStatus==='offen'?r.status==='offen':r.status===fStatus);
  list.sort((a,b)=>(b.datum||'').localeCompare(a.datum||'')||(b.seq||0)-(a.seq||0));
  $('#main').innerHTML=`
  <div class="row" style="justify-content:space-between;margin-bottom:14px"><div><h1>Rechnungen</h1><p class="sub" style="margin:0">Nächste Nummer: <b>${nrFormat(D.settings,new Date().getFullYear(),nextSeq(D,new Date().getFullYear()))}</b></p></div>
  <button class="btn pri" id="neu">+ Neue Rechnung</button></div>
  <div class="card">
    <div class="row" style="margin-bottom:10px">
      <select id="fk" style="max-width:240px"><option value="">Alle Kunden</option>${D.kunden.map(k=>`<option value="${k.id}" ${fKunde===k.id?'selected':''}>${h(k.name)}</option>`).join('')}</select>
      <select id="fs" style="max-width:180px"><option value="">Alle Status</option>${['entwurf','offen','bezahlt','storniert'].map(s=>`<option value="${s}" ${fStatus===s?'selected':''}>${STATUS_TXT[s]}</option>`).join('')}</select>
    </div>
    <div class="scroll"><table><thead><tr><th>Nr.</th><th>Datum</th><th>Kunde</th><th>Fällig</th><th>Status</th><th class="n">Total</th><th></th></tr></thead><tbody>
    ${list.length?list.map(r=>`<tr class="click" data-id="${r.id}"><td><b>${h(r.nr||'—')}</b></td><td>${fmtDate(r.datum)}</td><td>${h(r.kunde?.name||kundeById(r.kundeId)?.name||'')}</td><td>${fmtDate(r.faellig)}</td><td>${badge(invStatus(r))}</td><td class="n">${fmtMoney(r.total??calcInvoice(r,D.settings).total,r.waehrung)}</td>
      <td class="n" data-stop>${r.nr?`<button class="btn sm" data-pdf="${r.id}">PDF</button> `:''}${r.status==='offen'?`<button class="btn sm" data-paid="${r.id}">Bezahlt</button> `:''}<button class="btn sm" data-copy="${r.id}" title="Als neue Rechnung kopieren">Kopieren</button></td></tr>`).join(''):`<tr><td colspan="7" class="empty">Keine Rechnungen gefunden.</td></tr>`}
    </tbody></table></div>
  </div>`;
  $('#neu').onclick=()=>{editing=newInvoice();view='editor';render()};
  $('#fk').onchange=e=>{fKunde=e.target.value;render()};
  $('#fs').onchange=e=>{fStatus=e.target.value;render()};
  document.querySelectorAll('tr[data-id]').forEach(t=>t.onclick=e=>{if(e.target.closest('[data-stop]'))return;editing=JSON.parse(JSON.stringify(D.rechnungen.find(r=>r.id===t.dataset.id)));view='editor';render()});
  document.querySelectorAll('[data-pdf]').forEach(b=>b.onclick=()=>{const r=D.rechnungen.find(x=>x.id===b.dataset.pdf);openFile(r.pdf.split('/'))});
  document.querySelectorAll('[data-paid]').forEach(b=>b.onclick=async()=>{const r=D.rechnungen.find(x=>x.id===b.dataset.paid);r.status='bezahlt';r.bezahltAm=todayISO();await save();toast(r.nr+' als bezahlt markiert');render()});
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const r=D.rechnungen.find(x=>x.id===b.dataset.copy);const n=newInvoice(r.kundeId);n.positionen=JSON.parse(JSON.stringify(r.positionen));n.betreff=r.betreff;n.steuerArt=r.steuerArt;n.mwstSatz=r.mwstSatz;n.waehrung=r.waehrung;n.satz=r.satz;editing=n;view='editor';render()});
}
function defLiefertermin(datum){const d=new Date(datum+'T12:00:00');if(d.getDate()<=15){d.setDate(0);return d.toISOString().slice(0,10)}return datum}
const isHourUnit=u=>/^(h|std|stk)$/i.test((u||'').trim());
function newInvoice(kundeId){
  const S=D.settings,k=kundeId?kundeById(kundeId):null,datum=todayISO();
  const ziel=+(k?.ziel||S.ziel);
  return {id:uid(),nr:'',seq:0,jahr:0,kundeId:k?.id||'',datum,ziel,faellig:addDays(datum,ziel),liefertermin:defLiefertermin(datum),zeitraum:'',betreff:'',zahlText:k?.zahlText||'',
    positionen:[{text:'',menge:'',einheit:'Std',preis:k?.satz||''}],satz:k?.satz||'',
    steuerArt:k?(k.steuer==='auto'?steuerAuto(k.land):k.steuer):'mwst',mwstSatz:S.mwst,waehrung:k?.waehrung||S.waehrung,status:'entwurf',bemerkung:''};
}

/* ---------- Rechnungs-Editor ---------- */
function vEditor(){
  const r=editing,S=D.settings,fixed=!!r.nr;
  $('#main').innerHTML=`
  <div class="row" style="justify-content:space-between;margin-bottom:14px">
    <div><h1>${r.nr?'Rechnung '+h(r.nr):'Neue Rechnung'}</h1><p class="sub" style="margin:0">${badge(invStatus(r))} ${r.bezahltAm?'<span class="muted">bezahlt am '+fmtDate(r.bezahltAm)+'</span>':''} ${r.abNr?`<span class="muted">aus Auftragsbestätigung <b>${h(r.abNr)}</b>${r.lsNr?' · Lieferschein '+h(r.lsNr):''}</span>`:''}</p></div>

  <div class="card"><div class="form">

    <label class="f">Bestellnummer des Kunden<input type="text" id="e-bestell" value="${h(r.bestellNr||'')}" placeholder="falls vorhanden"></label>
    <label class="f">Stundensatz dieser Rechnung<input type="number" id="e-satz" value="${h(r.satz)}" step="0.05" placeholder="aus Kunde"></label>
    <label class="f">Währung<select id="e-cur">${['CHF','EUR'].map(c=>`<option ${r.waehrung===c?'selected':''}>${c}</option>`).join('')}</select></label>
    <label class="f">Steuer<select id="e-steuer">
      <option value="mwst" ${r.steuerArt==='mwst'?'selected':''}>Schweizer MWST</option>
      <option value="rc" ${r.steuerArt==='rc'?'selected':''}>Reverse Charge (Ausland)</option>
      <option value="frei" ${r.steuerArt==='frei'?'selected':''}>Ohne MWST</option></select></label>
    <label class="f">MWST-Satz %<input type="number" id="e-mwst" value="${r.mwstSatz}" step="0.1" ${r.steuerArt!=='mwst'?'disabled':''}></label>
  </div>
  <div id="e-hint" style="margin-top:12px"></div></div>

  <div class="card"><h2>Positionen</h2><div class="scroll">
    <table class="pos"><thead><tr><th class="c-text">Beschreibung</th><th class="c-m n">Stunden / Menge</th><th class="c-e">Einheit</th><th class="c-p n">Ansatz</th><th class="c-b n">Betrag</th><th class="c-x"></th></tr></thead>
    <tbody id="pos"></tbody></table></div>
    <div class="row" style="margin-top:8px"><button class="btn sm" id="addpos">+ Stunden-Position</button><button class="btn sm" id="addpos2">+ Pauschal / Spesen</button></div>
    <div class="totals" id="tot" style="margin-top:12px"></div>
  </div>

  <div class="card"><div class="form">
    <label class="f wide">Zahlungsbedingungen (leer = Standard aus Einstellungen; Platzhalter {ziel} {faellig})<input type="text" id="e-zahl" value="${h(r.zahlText||'')}" placeholder="${h(D.settings.zahlText)}"></label>
    <label class="f wide">Bemerkung auf der Rechnung (optional)<textarea id="e-bem">${h(r.bemerkung)}</textarea></label></div></div>

  <div class="row end">
    ${r.status==='entwurf'&&D.rechnungen.some(x=>x.id===r.id)?'<button class="btn danger" id="del">Entwurf löschen</button>':''}
    ${fixed&&r.status!=='storniert'?'<button class="btn danger" id="storno">Stornieren</button>':''}
    ${fixed&&r.status==='offen'?'<button class="btn" id="paid">Als bezahlt markieren</button>':''}
    ${fixed&&r.status==='bezahlt'?'<button class="btn" id="unpaid">Wieder offen</button>':''}
    ${!fixed?'<button class="btn" id="draft">Entwurf speichern</button>':''}
    <button class="btn" id="preview">PDF-Vorschau</button>
    <button class="btn pri" id="final">${fixed?'Änderungen speichern + PDF neu':'Rechnung erstellen'}</button>
  </div>`;
  const posBody=$('#pos');
  const drawPos=()=>{posBody.innerHTML=r.positionen.map((p,i)=>`<tr>
    <td class="c-text"><textarea data-i="${i}" data-k="text" rows="${Math.max(2,String(p.text||'').split('\n').length)}" placeholder="1. Zeile = fett (Titel), weitere Zeilen = Beschreibung" style="min-height:0">${h(p.text)}</textarea></td>
    <td class="c-m"><input type="number" data-i="${i}" data-k="menge" value="${h(p.menge)}" step="0.25" style="text-align:right"></td>
    <td class="c-e"><input type="text" data-i="${i}" data-k="einheit" value="${h(p.einheit)}" list="einheiten"></td>
    <td class="c-p"><input type="number" data-i="${i}" data-k="preis" value="${h(p.preis)}" step="0.05" style="text-align:right"></td>
    <td class="c-b n" id="pb${i}"></td>
    <td class="c-x"><button class="btn sm" data-rm="${i}" title="Entfernen">✕</button></td></tr>`).join('')+'<datalist id="einheiten"><option>Std</option><option>h</option><option>Pauschal</option><option>Stk</option><option>km</option><option>Tag</option></datalist>';
    posBody.querySelectorAll('input,textarea').forEach(inp=>inp.oninput=()=>{const p=r.positionen[+inp.dataset.i];p[inp.dataset.k]=inp.type==='number'?inp.value:inp.value;upd()});
    posBody.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{r.positionen.splice(+b.dataset.rm,1);if(!r.positionen.length)r.positionen.push({text:'',menge:'',einheit:'Std',preis:r.satz});drawPos()});
    upd();
  };
  const upd=()=>{
    const c=calcInvoice(r,S);
    r.positionen.forEach((p,i)=>{const e=$('#pb'+i);if(e)e.textContent=fmtNum(r2((+p.menge||0)*(+p.preis||0)))});
    const hours=r.positionen.filter(p=>isHourUnit(p.einheit)).reduce((s,p)=>s+(+p.menge||0),0);
    $('#tot').innerHTML=`<div><span class="muted">Stunden total</span><span>${fmtMenge(hours)} h</span></div>
      <div><span>Total netto</span><span>${fmtMoney(c.netto,r.waehrung)}</span></div>
      <div><span>${r.steuerArt==='mwst'?'MWST '+fmtMenge(c.mwstProzent)+' %':r.steuerArt==='rc'?'MWST (Reverse Charge)':'MWST'}</span><span>${fmtMoney(c.mwst,r.waehrung)}</span></div>
      ${c.rund?`<div><span class="muted">Rundung</span><span>${fmtMoney(c.rund,r.waehrung)}</span></div>`:''}
      <div class="grand"><span>Rechnungsbetrag</span><span>${fmtMoney(c.total,r.waehrung)}</span></div>`;
    const k=kundeById(r.kundeId);
    $('#e-hint').innerHTML=r.steuerArt==='rc'?`<div class="note">Reverse Charge: keine Schweizer MWST, Hinweistext kommt auf die Rechnung.${k&&!k.uid?' <b>Achtung: beim Kunden ist keine UID hinterlegt – sie gehört auf eine Reverse-Charge-Rechnung.</b>':''}</div>`:'';
  };
  drawPos();
  const v=id=>$(id).value;
  $('#e-kunde').onchange=()=>{const k=kundeById(v('#e-kunde'));const old=r.satz;r.kundeId=k?.id||'';
    if(k){r.satz=k.satz;r.waehrung=k.waehrung||S.waehrung;r.steuerArt=k.steuer==='auto'?steuerAuto(k.land):k.steuer;r.ziel=+(k.ziel||S.ziel);r.faellig=addDays(r.datum,r.ziel);r.zahlText=k.zahlText||'';
      r.positionen.forEach(p=>{if(p.preis===''||+p.preis===+old)p.preis=k.satz})}
    syncFromR()};

function vEditorKeep(){vEditor()}
function snapshot(r){
  const k=kundeById(r.kundeId)||r.kunde||{};
  const out=JSON.parse(JSON.stringify(r));
  out.kunde={name:k.name,zusatz:k.zusatz,kontakt:k.kontakt,strasse:k.strasse,plzOrt:k.plzOrt,land:k.land,uid:k.uid};
  out.positionen=out.positionen.filter(p=>(p.text||'').trim()||+p.menge||+p.preis);
  Object.assign(out,calcInvoice(out,D.settings));
  return out;
}
function storeInv(r){const s=snapshot(r);const i=D.rechnungen.findIndex(x=>x.id===r.id);if(i>=0)D.rechnungen[i]=s;else D.rechnungen.push(s);Object.assign(r,s);return s}
async function finalize(r){
  if(!r.kundeId)return toast('Bitte Kunde wählen');
  const s0=snapshot(r);
  if(!s0.positionen.length)return toast('Bitte mindestens eine Position erfassen');
  if(s0.positionen.some(p=>!(p.text||'').trim()))return toast('Bitte jede Position beschreiben');
  const neu=!r.nr;
  if(r.nr){if(!await ask('Die Rechnung '+r.nr+' wurde bereits erstellt. Änderungen speichern? Das bisherige PDF wird im Unterordner „Archiv“ aufbewahrt.','Speichern'))return}
  else{
    const y=+r.datum.slice(0,4);const seq=nextSeq(D,y);const nr=nrFormat(D.settings,y,seq);
    if(!await ask('Rechnung mit der Nummer '+nr+' erstellen? Danach ist die Nummer fest vergeben.','Erstellen'))return;
    r.nr=nr;r.seq=seq;r.jahr=y;r.status='offen';
  }
  logEintrag(r,neu?'Erstellt':'Geändert');
  const s=storeInv(r);
  if(neu&&r.abId){const ab=dokById(r.abId);if(ab){ab.status='verrechnet';ab.rechnungNr=s.nr;ab.rechnungId=s.id;logEintrag(ab,'Verrechnet – '+s.nr)}
    D.dokumente.filter(x=>x.typ==='ls'&&x.abId===r.abId&&x.nr&&x.status==='erstellt'&&(!r.lsIds||r.lsIds.includes(x.id))).forEach(x=>{x.status='verrechnet';logEintrag(x,'Verrechnet – '+s.nr)})}
  const pdf=buildInvoicePDF(s,D.settings,await logoForPdf());
  const path=['Ausgangsrechnungen',String(s.jahr),`${s.nr}_${slug(s.kunde.name)}.pdf`];
  if(!neu&&s.pdf)await archivierePdf(s.pdf.split('/'));
  if(s.pdf&&s.pdf!==path.join('/'))await removeFile(s.pdf.split('/'));
  await writeFile(path,new Blob([pdf],{type:'application/pdf'}));
  s.pdf=r.pdf=path.join('/');
  await save();
  toast('Rechnung '+s.nr+' erstellt – PDF gespeichert in '+path.slice(0,2).join('/'));
  render();
  showPdf(pdf,path.at(-1));
}

/* ---------- Finanzen: Einnahmen/Ausgaben, Rücklage ---------- */
const MONATE=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const MON3=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const FIX_KAT={dauerauftrag:'Dauerauftrag',rueckzahlung:'Rückzahlung / Kredit',ueberweisung:'Überweisung',miete:'Miete',steuern:'Steuern',sozial:'AHV / Sozialversicherung',versicherung:'Versicherung',sonstiges:'Sonstiges'};
const BEREICH={geschaeft:'Geschäftlich',privat:'Privat'};
const isPriv=f=>f.bereich==='privat';
const fixMonat=f=>toCHF(f.betrag,f.waehrung)/(+f.rhythmus||1);
const RHYTHMUS={1:'monatlich',3:'vierteljährlich',6:'halbjährlich',12:'jährlich'};
let finTab='vergleich',finMonat=null,fixFilter='alle';
function einSchnitt(){const now=new Date();const n=year===now.getFullYear()?Math.max(1,now.getMonth()+1):12;let s=0;for(let m=1;m<=n;m++)s+=finMonth(year,m).ein;return r2(s/n)}
function toCHF(v,c){const S=D.settings;v=+v||0;if(c==='EUR')return v*(+S.eurKurs||1);if(c==='USD')return v*(+S.usdKurs||1);return v}
const mk=(y,m)=>`${y}-${String(m).padStart(2,'0')}`;
function mDiff(a,b){const [ay,am]=a.split('-').map(Number),[by,bm]=b.split('-').map(Number);return (by*12+bm)-(ay*12+am)}
function fixAktiv(f,mkey){return f.start&&mkey>=f.start&&(!f.ende||mkey<=f.ende)}
function fixSpar(f,mkey){if(!f.start)return false;const d=mDiff(f.start,mkey);return d>=-((+f.rhythmus||1)-1)&&(!f.ende||mkey<=f.ende)}
function fixFaellig(f,mkey){return fixAktiv(f,mkey)&&mDiff(f.start,mkey)%(+f.rhythmus||1)===0}
function finMonth(y,m){
  const key=mk(y,m);
  const rech=D.rechnungen.filter(r=>r.nr&&r.status!=='storniert'&&(r.datum||'').startsWith(key));
  const ein=rech.reduce((s,r)=>s+toCHF(r.netto,r.waehrung),0);
  const mwstEin=rech.reduce((s,r)=>s+toCHF(r.mwst,r.waehrung),0);
  const fix=D.fixkosten.filter(f=>fixFaellig(f,key));
  const ausFix=fix.filter(f=>!isPriv(f)).reduce((s,f)=>s+toCHF(f.betrag,f.waehrung),0);
  const privFix=fix.filter(isPriv).reduce((s,f)=>s+toCHF(f.betrag,f.waehrung),0);
  const einz=D.ausgaben.filter(a=>(a.datum||'').startsWith(key));
  const ausEinz=einz.reduce((s,a)=>s+toCHF(a.betrag,a.waehrung),0);
  const lief=D.eingang.filter(e=>(e.datum||'').startsWith(key));
  const ausLief=lief.reduce((s,e)=>s+toCHF(e.betrag,e.waehrung),0);
  const vorsteuer=einz.reduce((s,a)=>s+toCHF(a.mwst,a.waehrung),0)+lief.reduce((s,e)=>s+toCHF(e.mwst,e.waehrung),0);
  const aus=ausFix+ausEinz+ausLief;
  return {key,ein:r2(ein),mwstEin:r2(mwstEin),ausFix:r2(ausFix),ausEinz:r2(ausEinz),ausLief:r2(ausLief),aus:r2(aus),vorsteuer:r2(vorsteuer),ergebnis:r2(ein-aus),privFix:r2(privFix),rest:r2(ein-aus-privFix),fix,einz,lief};
}
/* Rücklagekonto: was jeden Monat einbezahlt wird und was davon bezahlt wird */
function ruecklagePlan(y){
  const S=D.settings,per=+S.mwstPeriode||3,months=[];
  let saldo=+S.ruecklageStart||0,minSaldo=Infinity;
  for(let m=1;m<=12;m++){
    const key=mk(y,m),fm=finMonth(y,m);
    const items=D.fixkosten.filter(f=>f.ruecklage&&fixSpar(f,key));
    const fixAnteil=items.reduce((s,f)=>s+toCHF(f.betrag,f.waehrung)/(+f.rhythmus||1),0);
    const mwstNetto=S.mwstRuecklage?Math.max(0,fm.mwstEin-fm.vorsteuer):0;
    const steuerAnteil=(+S.steuerProzent||0)/100*Math.max(0,fm.ergebnis);
    const ein=r2(fixAnteil+mwstNetto+steuerAnteil);
    // Auszahlungen: fällige Rücklage-Posten + MWST-Abrechnung (60 Tage nach Periodenende)
    const out=[];
    D.fixkosten.filter(f=>f.ruecklage&&fixFaellig(f,key)).forEach(f=>out.push({text:f.name,betrag:r2(toCHF(f.betrag,f.waehrung))}));
    if(S.mwstRuecklage){
      let pm=m-2,py=y;if(pm<1){pm+=12;py--}
      if(pm%per===0){let sum=0;for(let i=0;i<per;i++){let mm=pm-i,yy=py;if(mm<1){mm+=12;yy--}const f=finMonth(yy,mm);sum+=Math.max(0,f.mwstEin-f.vorsteuer)}
        if(sum>0)out.push({text:`MWST-Abrechnung ${per===3?'Q'+(pm/3):(pm===6?'1. Halbjahr':'2. Halbjahr')} ${py}`,betrag:r2(sum)})}
    }
    const aus=r2(out.reduce((s,o)=>s+o.betrag,0));
    months.push({m,key,bedarf:ein,ein,fixAnteil:r2(fixAnteil),mwstNetto:r2(mwstNetto),steuerAnteil:r2(steuerAnteil),out,aus,saldo:0});
  }
  // Fester Monatsbetrag: Fixkosten-Anteil (gleichmässig) + Durchschnitt der variablen Teile
  const fixJahr=months.reduce((s,x)=>s+x.fixAnteil,0);
  const varJahr=months.reduce((s,x)=>s+x.mwstNetto+x.steuerAnteil,0);
  const now=new Date(),bisher=y===now.getFullYear()?Math.max(1,now.getMonth()+1):12;
  const varSchnitt=months.slice(0,bisher).reduce((s,x)=>s+x.mwstNetto+x.steuerAnteil,0)/bisher;
  const fixSchnitt=fixJahr/12;
  const empfehlung=Math.ceil((fixSchnitt+varSchnitt)/50)*50;
  for(const x of months){x.ein=empfehlung;saldo=r2(saldo+x.ein-x.aus);x.saldo=saldo;minSaldo=Math.min(minSaldo,saldo)}
  // Aufschlüsselung Fixkosten nach Kategorie (Monatsanteil)
  const proKat={};D.fixkosten.filter(f=>f.ruecklage).forEach(f=>{const a=months.filter(x=>fixSpar(f,x.key)).length;if(!a)return;proKat[f.kategorie]=(proKat[f.kategorie]||0)+toCHF(f.betrag,f.waehrung)/(+f.rhythmus||1)*a/12});
  return {months,minSaldo:r2(minSaldo),fixSchnitt:r2(fixSchnitt),varSchnitt:r2(varSchnitt),empfehlung,proKat,varJahr:r2(varJahr)};
}

async function fileToJpeg(file,rot=0,max=2000){
  let bmp;try{bmp=await createImageBitmap(file)}catch(e){return null}
  let w=bmp.width,h=bmp.height;const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
  const r=((rot%360)+360)%360,c=document.createElement('canvas');
  c.width=(r%180)?h:w;c.height=(r%180)?w:h;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  x.translate(c.width/2,c.height/2);x.rotate(r*Math.PI/180);x.drawImage(bmp,-w/2,-h/2,w,h);
  const blob=await new Promise(res=>c.toBlob(res,'image/jpeg',0.82));
  return blob?{blob,w:c.width,h:c.height}:null;
}
async function blobToBin(blob){const u=new Uint8Array(await blob.arrayBuffer());let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return s}
function dateFromName(name,fallbackMs){
  const m=name.match(/(20\d{2})[-_.]?(0[1-9]|1[0-2])[-_.]?(0[1-9]|[12]\d|3[01])/);
  if(m)return `${m[1]}-${m[2]}-${m[3]}`;
  if(fallbackMs){const d=new Date(fallbackMs);return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
  return todayISO();
}
async function scanBelege(){

    belegPending.push({name:n,file:f,isPdf:/\.pdf$/i.test(n),url:/\.(heic|heif|pdf)$/i.test(n)?'':URL.createObjectURL(f),datum:dateFromName(n,f.lastModified)})}

async function jpegAusPdf(file){
  // liest das Belegfoto aus einem PDF von re rec / re admin (JPEG-Bild im PDF)
  try{const s=await blobToBin(file);let best=null;const re=/\/Width (\d+) \/Height (\d+)[^>]*?\/Filter \/DCTDecode \/Length (\d+) >>\r?\nstream\r?\n/g;let m;

    return best&&best.bin.charCodeAt(0)===0xFF&&best.bin.charCodeAt(1)===0xD8?best:null}catch(e){return null}
}

let importLaeuft=false;
async function importiereHandyBelege(still){
  if(!D||importLaeuft)return 0;importLaeuft=true;let n=0;const monate=new Set();
  try{
    const files=(await listFiles(['Kassabelege'])).filter(f=>/\.pdf$/i.test(f));
    for(const name of files){
      const f=await readFile(['Kassabelege',name]);if(!f)continue;
      const kopfTxt=await blobToBin(f.slice(0,8192));const m=kopfTxt.match(/%RE-REC-DATA ([A-Za-z0-9+\/=]+)/);if(!m)continue;
      let meta;try{meta=JSON.parse(decodeURIComponent(escape(atob(m[1]))))}catch(e){continue}
      if(!meta||!/^\d{4}-\d{2}-\d{2}$/.test(meta.datum||'')||!(+meta.betrag>0))continue;
      const ym=meta.datum.slice(0,7),ziel=['Kassabelege',ym.slice(0,4),ym.slice(5),name];
      await moveFile(['Kassabelege',name],ziel);
      if(!D.ausgaben.some(x=>x.id===meta.id)){
        D.ausgaben.push({id:meta.id||uid(),datum:meta.datum,text:meta.text||'Kassabeleg',kategorie:meta.kategorie||'',betrag:+meta.betrag,waehrung:meta.waehrung||'CHF',mwst:meta.mwst===''||meta.mwst==null?'':+meta.mwst,beleg:ziel.join('/'),quelle:'re rec',erfasst:meta.erfasst||''});n++}
      monate.add(ym);

    if(monate.size){await save();for(const ym of monate)await buildBelegMonatsPdf(ym)}
  }catch(e){console.error(e)}
  importLaeuft=false;
  if(n&&!still)toast(`${n===1?'1 Beleg':n+' Belege'} von re rec übernommen`);
  return n;
}

function nextSeqDoc(typ,y){let max=0;for(const d of D.dokumente)if(d.typ===typ&&d.nr&&d.jahr===y)max=Math.max(max,d.seq||0);const st=+(((D.settings.nrKreise||{})[typ]||{}).start||{})[y]||1;return Math.max(max+1,st)}
function nrDoc(typ,y,seq){return nrFormat({...D.settings,praefix:((D.settings.nrKreise||{})[typ]||{}).praefix??''},y,seq)}
function dokStatus(d){if(d.typ==='angebot'&&d.status==='offen'&&!d.freibleibend&&d.gueltigBis&&d.gueltigBis<todayISO())return 'abgelaufen';return d.status}
function dokSnap(d){

  o.kunde={name:k.name,zusatz:k.zusatz,kontakt:k.kontakt,strasse:k.strasse,plzOrt:k.plzOrt,land:k.land,uid:k.uid};

function storeDok(d){const s=dokSnap(d);const i=D.dokumente.findIndex(x=>x.id===d.id);if(i>=0)D.dokumente[i]=s;else D.dokumente.push(s);Object.assign(d,s);return s}
function logEintrag(d,text){d.verlauf=[...(d.verlauf||[]),{zeit:new Date().toISOString(),text}]}
async function archivierePdf(path){

function abAusAngebot(an){

function lsAusAb(ab){
  return {id:uid(),typ:'ls',nr:'',seq:0,jahr:0,kundeId:ab.kundeId,kunde:ab.kunde,datum:todayISO(),lieferdatum:todayISO(),betreff:ab.betreff,

function rechnungAusAb(ab,ls){
  const r=newInvoice(ab.kundeId);
  Object.assign(r,{positionen:JSON.parse(JSON.stringify(ab.positionen)),betreff:ab.betreff,steuerArt:ab.steuerArt,mwstSatz:ab.mwstSatz,
    waehrung:ab.waehrung,satz:ab.satz,zahlText:ab.zahlText,ziel:+ab.ziel||r.ziel,
    bestellNr:ab.bestellNr,bestellDatum:ab.bestellDatum,angebotNr:ab.angebotNr,angebotDatum:ab.angebotDatum,abId:ab.id,abNr:ab.nr,abDatum:ab.datum});
  r.faellig=addDays(r.datum,r.ziel);
  if(ls){r.positionen=r.positionen.map((p,i)=>({...p,menge:ls.positionen[i]?ls.positionen[i].menge:p.menge}));r.lsNr=ls.nr;r.lsIds=[ls.id];r.liefertermin=ls.lieferdatum;return r}
  const lss=D.dokumente.filter(x=>x.typ==='ls'&&x.abId===ab.id&&x.nr&&x.status!=='storniert');
  if(lss.length){r.lsNr=lss.map(x=>x.nr).join(', ');r.lsIds=lss.map(x=>x.id);r.liefertermin=lss.map(x=>x.lieferdatum).sort().at(-1)}
  else if(ab.liefertermin)r.liefertermin=ab.liefertermin;
  return r;
}
async function starteRechnungAusAb(ab,ls){
  if(ab.rechnungNr&&!await ask(`Die Auftragsbestätigung ${ab.nr} ist bereits mit Rechnung ${ab.rechnungNr} verrechnet. Trotzdem eine weitere Rechnung erstellen?`,'Weitere Rechnung'))return;
  editing=rechnungAusAb(ab,ls);view='editor';render();toast('Rechnung aus '+(ls?ls.nr:ab.nr)+' vorbereitet – Stunden prüfen und erstellen');
}
async function starteLsAusAb(ab){editDok=lsAusAb(ab);view='dokeditor';render()}
function abVonAngebot(an){return D.dokumente.filter(x=>x.typ==='ab'&&x.angebotId===an.id&&x.nr&&x.status!=='storniert')}
/* Vorgang: Angebot → AB → Lieferschein → Rechnung */
function vorgangHtml(d){
  const an=d.typ==='angebot'?d:dokById(d.angebotId);
  const abs=an?D.dokumente.filter(x=>x.typ==='ab'&&x.angebotId===an.id&&x.nr):(d.typ==='ab'?[d]:d.abId?[dokById(d.abId)].filter(Boolean):[]);
  const abIds=abs.map(x=>x.id);
  const lss=D.dokumente.filter(x=>x.typ==='ls'&&x.nr&&abIds.includes(x.abId));
  const res=D.rechnungen.filter(r=>r.nr&&abIds.includes(r.abId));
  const chip=(lbl,nr,attr,cur,st)=>`<button class="vchip ${cur?'cur':''} ${st==='storniert'?'storno':''}" ${attr}><span>${lbl}</span><b>${h(nr)}</b></button>`;
  const parts=[];
  if(an&&an.nr)parts.push(chip('Angebot',an.nr,`data-vdok="${an.id}"`,an.id===d.id,an.status));
  abs.forEach(x=>parts.push(chip('Auftragsbest.',x.nr,`data-vdok="${x.id}"`,x.id===d.id,x.status)));
  lss.forEach(x=>parts.push(chip('Lieferschein',x.nr,`data-vdok="${x.id}"`,x.id===d.id,x.status)));
  res.forEach(x=>parts.push(chip('Rechnung',x.nr,`data-vre="${x.id}"`,false,x.status)));
  if(!parts.length)return '';
  return `<div class="vorgang"><span class="muted">Vorgang</span>${parts.join('<span class="varr">→</span>')}</div>`;
}
function bindVorgang(){
  document.querySelectorAll('[data-vdok]').forEach(b=>b.onclick=()=>{const x=dokById(b.dataset.vdok);if(!x)return;editDok=JSON.parse(JSON.stringify(x));view='dokeditor';render()});
  document.querySelectorAll('[data-vre]').forEach(b=>b.onclick=()=>{editing=JSON.parse(JSON.stringify(D.rechnungen.find(r=>r.id===b.dataset.vre)));view='editor';render()});
}

async function starteAbAusAngebot(an){

async function finalizeDok(d){
  const T=DOC_TYP[d.typ];
  if(!d.kundeId)return toast('Bitte Kunde wählen');
  const s0=dokSnap(d);
  if(!s0.positionen.length)return toast('Bitte mindestens eine Position erfassen');
  if(s0.positionen.some(p=>!(p.text||'').trim()))return toast('Bitte jede Position beschreiben');
  if(d.typ==='angebot'&&!d.freibleibend&&!d.gueltigBis)return toast('Bitte „Gültig bis“ angeben oder „freibleibend“ wählen');
  if(d.typ!=='angebot'&&!d.nr&&!(d.bestellNr||'').trim()&&!await ask('Es ist keine Bestellnummer des Kunden eingetragen. Trotzdem erstellen?','Ohne Bestellnummer erstellen'))return;
  const neu=!d.nr;
  if(!neu){if(!await ask(`${T.titel} ${d.nr} wurde bereits erstellt. Änderungen speichern? Das bisherige PDF wird im Unterordner „Archiv“ aufbewahrt.`,'Speichern'))return}
  else{
    const y=+d.datum.slice(0,4),seq=nextSeqDoc(d.typ,y),nr=nrDoc(d.typ,y,seq);
    if(!await ask(`${T.titel} mit der Nummer ${nr} erstellen? Danach ist die Nummer fest vergeben.`,'Erstellen'))return;
    Object.assign(d,{nr,seq,jahr:y,status:d.typ==='ls'?'erstellt':'offen'});
  }
  logEintrag(d,neu?'Erstellt':'Geändert');
  const s=storeDok(d);
  const pdf=buildDocPDF(s,D.settings,await logoForPdf(),d.typ);
  const path=[T.ordner,String(s.jahr),`${s.nr}_${slug(s.kunde.name)}.pdf`];
  if(!neu&&s.pdf)await archivierePdf(s.pdf.split('/'));
  if(s.pdf&&s.pdf!==path.join('/'))await removeFile(s.pdf.split('/'));
  await writeFile(path,new Blob([pdf],{type:'application/pdf'}));
  s.pdf=d.pdf=path.join('/');
  if(neu&&d.typ==='ab'){const an=dokById(d.angebotId);if(an&&an.status!=='angenommen'){an.status='angenommen';logEintrag(an,'Angenommen – '+d.nr)}}
  if(neu&&d.typ==='ls'){const ab=dokById(d.abId);if(ab&&ab.status==='offen'){ab.status='geliefert';logEintrag(ab,'Geliefert – '+d.nr)}}
  await save();
  toast(`${T.titel} ${s.nr} erstellt – PDF in ${path.slice(0,2).join('/')}`);
  render();
  showPdf(pdf,path.at(-1));
}

/* ---------- Updates (wie in der Zeiterfassung) ---------- */
const APP_META=(()=>{try{return JSON.parse(document.getElementById('app-meta').textContent)}catch(e){return {version:'0',notes:[]}}})();
const APP_VERSION=APP_META.version;
const Upd={info:null,html:null,last:null,err:'',checking:false,timer:null,file:''};
const APP_FILE=(()=>{try{const n=decodeURIComponent(location.pathname.split('/').pop()||'');return /\.html?$/i.test(n)?n:'Admin.html'}catch(e){return 'Admin.html'}})();
function verCmp(a,b){const pa=String(a).split('.').map(Number),pb=String(b).split('.').map(Number);for(let i=0;i<Math.max(pa.length,pb.length);i++){const x=(pa[i]||0)-(pb[i]||0);if(x)return x}return 0}
function parseMeta(html){const m=String(html).match(/<script id="app-meta" type="application\/json">([\s\S]*?)<\/script>/);if(!m)return null;try{const j=JSON.parse(m[1]);return j&&j.version?j:null}catch(e){return null}}
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
function notesHtml(n){return n&&n.length?`<ul class="updnotes">${n.map(x=>`<li>${h(x)}</li>`).join('')}</ul>`:''}
async function checkUpdate(manual){
  if(!D||Upd.checking)return;
  Upd.checking=true;Upd.err='';refreshUpd();
  try{
    let meta=null,html=null;
    if(DEMO){const vp=String(APP_VERSION).split('.');meta={version:vp[0]+'.'+((+vp[1]||0)+1),date:todayISO(),notes:['Beispiel-Update: So sieht der Hinweis aus.','In der Vorschau wird nichts installiert.']}}
    else{
      let f=null,fn='';for(const n of ['Admin.html','Rechnungen.html']){f=await readFile(['Update',n]);if(f){fn=n;break}}
      if(f){html=await f.text();meta=parseMeta(html);Upd.file=fn;if(!meta)Upd.err='Die Datei „'+fn+'“ im Ordner Update ist keine gültige Version der App.'}
    }
    if(meta&&verCmp(meta.version,APP_VERSION)>0){Upd.info=meta;Upd.html=html}else{Upd.info=null;Upd.html=null}
    Upd.last=new Date();
    if(manual&&!Upd.info&&!Upd.err)toast('Die App ist aktuell (Version '+APP_VERSION+').');
  }catch(e){Upd.err='Update-Prüfung fehlgeschlagen: '+e.message}
  Upd.checking=false;refreshUpd();
}
function updBanner(){
  if(!Upd.info||lsGet('upd-dismiss')===Upd.info.version)return '<div id="upd-banner"></div>';
  return `<div id="upd-banner" class="updbar"><span><b>Update verfügbar:</b> Version ${h(Upd.info.version)}</span><button class="btn sm upd-go" data-upd-go>Jetzt aktualisieren</button><button class="btn sm ghost" data-upd-x title="Für diese Version ausblenden">✕</button></div>`;
}
function updCard(){
  let s=`<div class="updver"><div><span class="muted">Installierte Version</span> <b>${h(APP_VERSION)}</b></div>`;
  if(Upd.checking)s+=`<div class="muted">Suche nach Updates …</div>`;
  else if(Upd.info)s+=`<div class="updnew">Version ${h(Upd.info.version)} verfügbar</div>`;
  else if(Upd.err)s+=`<div class="updwarn">${h(Upd.err)}</div>`;
  else if(Upd.last)s+=`<div class="updok">✓ aktuell · geprüft um ${Upd.last.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'})}</div>`;
  s+='</div>';
  if(Upd.info)s+=`<div class="updbox"><b>Neu in Version ${h(Upd.info.version)}</b>${notesHtml(Upd.info.notes)}<button class="btn pri" data-upd-go>Jetzt aktualisieren</button>
    <p class="muted" style="font-size:12.5px;margin:8px 0 0">Deine Daten bleiben erhalten. Die bisherige Version wird unter <code>Update\\Alt</code> aufbewahrt. Die App startet danach neu.</p></div>`;
  else s+=`<div class="row" style="margin-top:12px"><button class="btn" data-upd-check ${Upd.checking?'disabled':''}>Nach Updates suchen</button><label class="btn">Update-Datei wählen …<input type="file" accept=".html,text/html" data-upd-file hidden></label></div>`;
  s+=`<p class="muted" style="font-size:12.5px;margin:12px 0 0">So kommt ein Update in die App: Neue <code>Admin.html</code> in den Ordner <code>${h(dir?.name||'Rechnungen')}\\Update</code> legen oder oben „Update-Datei wählen“. Die App prüft beim Start und alle 30 Minuten.</p>`;
  if(APP_META.notes&&APP_META.notes.length)s+=`<details class="updlog"><summary>Was ist neu in ${h(APP_VERSION)}?</summary>${notesHtml(APP_META.notes)}</details>`;
  return s;
}
function refreshUpd(){
  const b=document.getElementById('upd-banner');if(b)b.outerHTML=updBanner();
  const c=document.getElementById('upd-card');if(c)c.innerHTML=updCard();
  bindUpd();
}
function bindUpd(){
  document.querySelectorAll('[data-upd-go]').forEach(x=>x.onclick=installUpdate);
  document.querySelectorAll('[data-upd-x]').forEach(x=>x.onclick=()=>{lsSet('upd-dismiss',Upd.info?.version);refreshUpd()});
  document.querySelectorAll('[data-upd-check]').forEach(x=>x.onclick=()=>checkUpdate(true));
  document.querySelectorAll('[data-upd-file]').forEach(x=>x.onchange=async e=>{
    const f=e.target.files[0];if(!f)return;const meta=parseMeta(await f.text());
    if(!meta)return toast('Diese Datei ist keine Version der Rechnungs-App.');
    if(verCmp(meta.version,APP_VERSION)<=0)return toast(`Die Datei enthält Version ${meta.version} – installiert ist bereits ${APP_VERSION}.`);
    if(DEMO){Upd.info=meta;refreshUpd();return}
    await writeFile(['Update','Admin.html'],f);await checkUpdate(false);
  });
}
async function installUpdate(){
  if(!Upd.info)return;
  if(DEMO)return toast('In der Vorschau wird nichts installiert.');
  if(!Upd.html)return toast('Update-Datei nicht gefunden.');
  if(!await ask(`Auf Version ${Upd.info.version} aktualisieren? Deine Daten bleiben erhalten, die App startet danach neu.`,'Jetzt aktualisieren'))return;
  try{
    await save();await saving;
    const ziel=APP_FILE;
    const cur=await readFile([ziel]);
    if(cur)await writeFile(['Update','Alt',`${ziel.replace(/\.html$/i,'')}_v${APP_VERSION}_${todayISO()}.html`],cur);
    await writeFile([ziel],new Blob([Upd.html],{type:'text/html'}));
    await removeFile(['Update',Upd.file||'Admin.html']);
    lsSet('upd-target',Upd.info.version);
    if(NATIVE)location.replace('Admin.html?t='+Date.now());else location.reload();
  }catch(e){toast('Update fehlgeschlagen: '+e.message)}
}
function afterStart(){
  const t=lsGet('upd-target');
  if(t){lsSet('upd-target',null);
    if(verCmp(APP_VERSION,t)>=0)setTimeout(()=>toast('Aktualisiert auf Version '+APP_VERSION),400);
    else setTimeout(()=>{const m=modal(`<h2>Update gespeichert</h2><p>Version ${h(t)} liegt jetzt als <code>${h(APP_FILE)}</code> in deinem OneDrive-Ordner. Diese App wurde aber von einem anderen Ort gestartet und zeigt noch Version ${h(APP_VERSION)}.</p><p>Starte die App künftig mit <b>Admin starten.cmd</b> aus dem OneDrive-Ordner.</p><div class="row end"><button class="btn pri" id="ux">Verstanden</button></div>`);m.querySelector('#ux').onclick=()=>m.remove()},400)}
  checkUpdate(false);
  setTimeout(async()=>{const n=await importiereHandyBelege(true);if(n){toast(`${n===1?'1 Beleg':n+' Belege'} von re rec übernommen`);render()}},800);
  if(!Upd.belegTimer){Upd.belegTimer=setInterval(async()=>{if(document.visibilityState!=='visible')return;const n=await importiereHandyBelege(true);if(n){toast(`${n===1?'1 Beleg':n+' Belege'} von re rec übernommen`);if(['belege','finanzen','uebersicht'].includes(view))render()}},3*60*1000)}
  if(!Upd.timer){Upd.timer=setInterval(()=>checkUpdate(false),30*60*1000);
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&(!Upd.last||Date.now()-Upd.last>30*60*1000))checkUpdate(false)})}
}

/* ---------- Rechtscheck (Schweiz) ---------- */
function rechtsCheck(){
  const S=D.settings,out=[];
  const fix=(id,lbl)=>`<button class="btn sm" data-rfix="${id}">${lbl}</button>`;
  const ok=(t)=>out.push(['ok',t]);const w=(t,b)=>out.push(['warn',t,b]);const i=(t)=>out.push(['info',t]);
  if(!S.firma||!S.strasse||!S.plzOrt)w('Firmenname und Adresse vollständig erfassen – Name und Ort des Leistungserbringers gehören auf jede Rechnung (Art. 26 Abs. 2 lit. a MWSTG).');
  else ok('Firmenname und Adresse sind erfasst.');
  i(`Firmenname „${S.firma}“: Steht deine Firma im Handelsregister (z. B. als GmbH), muss der Name auf Rechnungen und Geschäftsbriefen genau so wie im Register stehen, inkl. Rechtsform (Art. 954a OR).`);
  if(+S.mwst>0){
    if(!S.uid)w('Deine MWST-Nummer fehlt. Wer MWST verrechnet, muss die Nummer aus dem MWST-Register angeben (Art. 26 Abs. 2 lit. a MWSTG).');
    else if(!/MWST|TVA|IVA/i.test(S.uid))w(`Deine UID „${S.uid}“ steht ohne den Zusatz „MWST“. Im MWST-Register eingetragene Unternehmen geben die Nummer im Format CHE-123.456.789 MWST an.`,fix('uid','„MWST“ ergänzen'));
    else ok('MWST-Nummer mit Zusatz „MWST“ ist erfasst.');
  }
  if(/inkl/i.test(S.mwstText||''))w(`Der Hinweis „${S.mwstText}“ widerspricht der Rechnung: Die MWST wird zum Nettobetrag dazugerechnet. Hinweis entfernen oder anpassen.`,fix('mwsttext','Hinweis entfernen'));
  else ok('Steuersatz und Steuerbetrag werden auf jeder Rechnung ausgewiesen (Art. 26 Abs. 2 lit. f MWSTG).');
  if(!/steuerschuld/i.test(S.rcText||''))w('Für Kunden in Österreich verlangt das österreichische Recht den Hinweis auf den Übergang der Steuerschuld auf den Leistungsempfänger und die UID des Kunden.',fix('rc','Hinweistext übernehmen'));
  else ok('Reverse-Charge-Hinweis nennt den Übergang der Steuerschuld.');
  const ohneUid=D.kunden.filter(k=>k.land&&k.land!=='CH'&&k.land!=='LI'&&!k.uid);
  if(ohneUid.length)w('Ausländische Kunden ohne UID: '+ohneUid.map(k=>k.name).join(', ')+'. Bei Reverse Charge gehört die UID des Kunden auf die Rechnung.');
  else if(D.kunden.some(k=>k.land==='AT'))ok('Alle Kunden in Österreich haben eine UID.');
  ok('Jede Rechnung nennt Datum bzw. Leistungszeitraum, Art und Umfang der Leistung und das Entgelt (Art. 26 Abs. 2 lit. c–e MWSTG).');
  ok('Angebote haben ein „Gültig bis“: Bis dahin bist du gebunden (Art. 3 OR). Alternativ „freibleibend“.');
  ok('Erstellte Dokumente werden nicht gelöscht, sondern storniert; die Nummer bleibt vergeben. Ersetzte PDFs landen im Unterordner „Archiv“.');
  i('Aufbewahrung: Rechnungen und Buchungsbelege 10 Jahre ab Ende des Geschäftsjahres (Art. 958f OR). Der OneDrive-Ordner samt Archiv und Backup sollte so lange erhalten bleiben.');
  return out;
}
function rechtsCheckHtml(){
  const ic={ok:'✓',warn:'!',info:'i'};
  const list=rechtsCheck();const n=list.filter(x=>x[0]==='warn').length;
  return `<div class="row" style="justify-content:space-between"><h2 style="margin:0">Rechtscheck Schweiz</h2>${n?`<span class="badge b-faellig">${n} Punkt${n>1?'e':''} prüfen</span>`:'<span class="badge b-bezahlt">alles erfüllt</span>'}</div>
  <ul class="rcheck">${list.map(([t,txt,btn])=>`<li class="rc-${t}"><span class="ri">${ic[t]}</span><span>${h(txt)}${btn?' '+btn:''}</span></li>`).join('')}</ul>
  <p class="muted" style="font-size:12.5px;margin:6px 0 0">Allgemeine Prüfung der Pflichtangaben, keine Rechtsberatung. Bei Unklarheiten Treuhänder fragen.</p>`;
}

  <div class="card"><h2>2. Outlook-Rechnungen automatisch ablegen (Power Automate)</h2>

  <ol class="steps">
    <li>Öffne <b>make.powerautomate.com</b> und melde dich mit h.reinbacher@re-solution.onl an. <b>Erstellen → Automatisierter Cloud-Flow</b>, Name „Rechnungen aus Outlook".</li>
    <li>Trigger: <b>Office 365 Outlook – Wenn eine neue E-Mail empfangen wird (V3)</b>. Erweiterte Optionen: Ordner <code>Posteingang</code>, <b>Nur mit Anlagen: Ja</b>, <b>Anlagen einschließen: Ja</b>. Optional „Betrefffilter": <code>Rechnung</code>.</li>

      Dateiinhalt (Ausdruck): <code>string(addProperty(addProperty(addProperty(json('{}'),'von',triggerOutputs()?['body/from']),'betreff',triggerOutputs()?['body/subject']),'empfangen',triggerOutputs()?['body/receivedDateTime']))</code></li>
    <li><b>Speichern</b> und mit „Testen" eine Mail mit PDF an dich selbst schicken. Die Datei erscheint danach unter „Eingangsrechnungen → Neu im Eingang".</li>
  </ol>
  <div class="note">Ohne Betrefffilter landet jedes PDF im Eingang – auch Nicht-Rechnungen. Diese einfach mit „Ignorieren" wegschieben. Bekannte Absender füllt die App beim nächsten Mal automatisch mit dem Lieferantennamen vor.</div></div>
  <div class="card"><h2>3. Kassabelege mit dem Handy: re rec</h2><ol class="steps">
    <li>Auf dem Handy <b>re rec</b> öffnen. Die Kamera startet sofort. Beleg in den Rahmen bringen und auslösen.</li>
    <li>re rec liest Datum, Betrag, MWST und Händler aus und schlägt die Kategorie vor. Werte prüfen, „Weiter“ und die Frage <b>„Sind alle Eingaben richtig?“</b> mit „Ja, speichern“ bestätigen.</li>
    <li>re rec legt den Beleg als PDF in <code>${base}\Kassabelege</code>. re admin übernimmt ihn automatisch als Ausgabe, verschiebt ihn nach <code>Kassabelege\Jahr\Monat</code> und aktualisiert das Sammel-PDF <code>Kassabelege_JJJJ-MM.pdf</code>.</li>
    <li>Am Monatsende unter <b>Finanz Management › Kassabelege</b> den Monat wählen: Liste vom 1. bis zum letzten Tag, und „Sammel-PDF öffnen“ zum Drucken oder Weiterleiten an die Buchhaltung.</li>
  </ol><p class="muted">Einrichtung von re rec: siehe LIES-MICH im re-rec-Paket. Die Anwendungs-ID ist dieselbe wie bei der Zeiterfassung.</p></div>
  <div class="card"><h2>4. Angebot → Auftragsbestätigung → Lieferschein → Rechnung</h2><ol class="steps">

    <li>In der Auftragsbestätigung <b>„Lieferschein erstellen →“</b>: Angebot, AB und Bestellnummer stehen automatisch drauf, die Mengen kannst du für Teillieferungen anpassen.</li>

  </ol></div>

    <li>Oben erscheint <b>„Update verfügbar“</b>. Auf <b>„Jetzt aktualisieren“</b> klicken. Die App ersetzt sich selbst und startet neu, deine Daten bleiben erhalten.</li>
    <li>Die vorherige Version liegt danach unter <code>${base}\Update\Alt</code>, falls du zurück willst.</li>
  </ol></div>
  <div class="card"><h2>6. Gut zu wissen</h2><ul>
    <li>Rechnungsnummern werden erst bei „Rechnung erstellen" vergeben, fortlaufend und lückenlos. Entwürfe haben keine Nummer. Erstellte Rechnungen werden nicht gelöscht, sondern storniert.</li>
    <li>Kunden in der Schweiz/Liechtenstein bekommen automatisch MWST (Satz in den Einstellungen änderbar), Kunden in Österreich und anderen Ländern automatisch Reverse Charge mit Hinweistext – pro Rechnung umstellbar.</li>
    <li>Die App läuft in Microsoft Edge oder Chrome. Firefox und Handy-Browser unterstützen den direkten Ordnerzugriff nicht.</li>
    <li>Nicht gleichzeitig an zwei PCs Rechnungen erstellen – OneDrive braucht kurz, bis <code>daten.json</code> synchronisiert ist.</li>
  </ul></div>`;
}

async function pickFolder(){
  try{dir=await window.showDirectoryPicker({id:'rechnungen',mode:'readwrite'});await idb.set('dir',dir);DEMO=false;await loadData();view='uebersicht';render();afterStart();toast('Verbunden mit '+dir.name)}
  catch(e){if(e.name!=='AbortError')toast('Ordner konnte nicht geöffnet werden: '+e.message)}
}
function startScreen(saved){
  const can=!!window.showDirectoryPicker;
  $('#app').innerHTML=`<div class="start card">
    <div class="brand" style="margin-bottom:14px"><img class="appicon" src="${APP_ICON}" alt="" style="width:52px;height:52px;border-radius:12px"><span class="bname" style="font-size:20px">re admin<small>Angebote · Aufträge · Rechnungen · Finanzen</small></span></div>
    ${can?`<p>Die App speichert alles – Daten, Rechnungs-PDFs und Eingangsrechnungen – in einem Ordner in deinem OneDrive.</p>
      <div class="row" style="margin:16px 0">${saved?`<button class="btn pri" id="re">Mit „${h(saved.name)}" verbinden</button>`:''}<button class="btn ${saved?'':'pri'}" id="pick">${saved?'Anderen Ordner wählen':'OneDrive-Ordner wählen'}</button></div>`
      :`<p class="note warn">Dieser Browser erlaubt keinen direkten Ordnerzugriff. Öffne die Datei in <b>Microsoft Edge</b> oder Chrome, um mit deinem OneDrive zu arbeiten.</p>`}
    <p class="muted" style="margin-top:18px">Nur anschauen? <button class="btn sm" id="demo">Vorschau mit Beispieldaten</button></p></div>`;
  $('#pick')&&($('#pick').onclick=pickFolder);
  $('#re')&&($('#re').onclick=async()=>{try{if(await saved.requestPermission({mode:'readwrite'})==='granted'){dir=saved;await loadData();render();afterStart()}}catch(e){toast('Kein Zugriff: '+e.message)}});
  $('#demo').onclick=startDemo;
}
